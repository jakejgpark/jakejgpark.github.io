name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v4  # 종근 님의 메인 브랜치

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 코드를 가져옵니다
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node.js 세팅 (버전 22로 업그레이드! 🚀)
        uses: actions/setup-node@v6
        with:
          node-version: 22  # <--- 드디어 22버전 장착!

      - name: 패키지 설치
        run: npm ci

      - name: 🚀 쿼츠 빌드 (웹사이트 굽기)
        run: npx quartz build

      - name: 결과물 업로드
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 GitHub Pages로 최종 배포
        id: deployment
        uses: actions/deploy-pages@v5